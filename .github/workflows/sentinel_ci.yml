name: Data Quality Sentinel CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Pip Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Synthetic Data Batch
        run: |
          python generate_data.py

      - name: Execute Validation & Ingestion Pipeline
        run: |
          python validate_and_ingest.py

      - name: Run Pytest Suite
        run: |
          pytest tests/

      - name: Upload Dead Letter Queue Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dead-letter-queue
          path: logs/dead_letter_queue.json