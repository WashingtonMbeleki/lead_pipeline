name: CI & Pipeline Health Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-suite:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Validate Database & CV Generator Core
      run: |
        python -c "
        from data_pipeline.db import ApplicationDatabase
        from engine.cv_generator import TailoredCVGenerator
        import os

        # Verify database initialization with local path
        db = ApplicationDatabase('data/test_applications.db')
        print('Database Schema Verified Successfully')
        if os.path.exists('data/test_applications.db'):
            os.remove('data/test_applications.db')
        "