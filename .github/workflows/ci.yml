name: Automated Data Quality Sentinel CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-data-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Virtual Environment Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Sentinel Data Validation Script
        run: |
          python run_sentinel.py

      - name: Upload Data Quality Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: data-quality-html-report